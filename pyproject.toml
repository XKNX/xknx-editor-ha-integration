[project]
name = "xknx-editor-ha-integration"
version = "0.1.0"
description = "Home Assistant integration that runs the XKNX Editor"
license = "Apache-2.0"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    # The frontend package of the same Home Assistant release (its frontend manifest).
    "home-assistant-frontend==20260930.5",
    "pytest-homeassistant-custom-component==0.13.375",
    "ruff>=0.16.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
