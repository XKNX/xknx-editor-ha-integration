# Tool settings only: the integration has no packages of its own (Home Assistant loads it from
# custom_components), and the test packages are in requirements_test.txt.

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # Home Assistant's own http server, not the integration (aiohttp discourages subclassing).
    "ignore:Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning",
]

[tool.coverage.run]
# Measured in CI with `pytest --cov` and uploaded to Codecov: the integration and the release
# scripts, without the tests and the tools for a local Home Assistant (scripts/dev).
source = ["custom_components/xknx_editor", "scripts"]
omit = ["scripts/dev/*"]

[tool.coverage.report]
# Lines that never run by design
exclude_also = [
    "if TYPE_CHECKING:",
    '@(typing\.)?overload',
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
