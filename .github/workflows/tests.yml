name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # From editor-release.yml, for the commit it releases afterwards
  workflow_call:
    inputs:
      ref:
        description: Commit to test
        type: string
        required: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uvx ruff format --check
      - run: uvx ruff check

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The Codecov upload signs in through the Codecov GitHub App (OIDC), without a token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv venv --python 3.14
      - run: uv pip install -r requirements_test.txt
      # With the coverage of what [tool.coverage.run] in pyproject.toml lists
      - run: .venv/bin/pytest --cov --cov-report=xml
      # Only uploaded for now: .codecov.yml turns off the status checks and comments on PRs.
      # Not failing the job, e.g. for a pull request from a fork, which gets no OIDC token.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
